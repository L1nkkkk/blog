<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TinyRender 代码蓝图</title>
<meta name="tags" content="TinyRender, 图形学">
<meta name="description" content="把 TinyRender 渲染器仓库拆成一张张蓝图节点图：光栅化管线、BVH 与求交、Whitted 光追与路径追踪、距离场与体积渲染，每个节点附签名、关键代码与原理。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
/* Layout: blueprint canvas (left, pan/zoom) + inspector panel (right); stacks on phones. Single dark look by design, like an editor graph. */
:root{
  color-scheme: dark;
  --ground:#14171b; --grid:#1c2026; --grid-major:#252a31;
  --panel:#1a1e23; --panel-2:#20252b; --line:#2e353d;
  --fg:#d9dee3; --muted:#8d97a1; --accent:#5aa9ff;
  --node:#262b31; --node-border:#3a414a;
  --h-event:#8a2d2a; --h-func:#285a8c; --h-pure:#3f6a2c; --h-macro:#4c5158; --h-branch:#5d5348; --h-par:#5a3b8e;
  --t-exec:#e9edf0; --t-mat:#f08a3c; --t-vec3:#f2c744; --t-vec2:#4fd2b6; --t-float:#9bd85a; --t-int:#48c6e8; --t-bool:#d9483f; --t-struct:#4a85e6; --t-color:#e463a8; --t-fn:#aa8cf5;
  --f-ui:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --f-code:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--ground);color:var(--fg);font-family:var(--f-ui);font-size:14px;margin:0;overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;}
header{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.02em;white-space:nowrap}
header h1 small{font-weight:400;color:var(--muted);font-family:var(--f-code);font-size:11px;margin-left:8px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.tab{font:inherit;font-size:12.5px;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:5px;padding:4px 10px;cursor:pointer}
.tab:hover{color:var(--fg);border-color:var(--line)}
.tab[aria-selected="true"]{color:var(--fg);background:var(--panel-2);border-color:var(--node-border)}
.tab .lvl{font-family:var(--f-code);font-size:10px;color:var(--accent);margin-right:5px}
.mods{display:flex;gap:2px;flex-wrap:wrap;background:var(--ground);border:1px solid var(--line);border-radius:7px;padding:3px}
.mod{font:inherit;font-size:12.5px;color:var(--muted);background:transparent;border:0;border-radius:5px;padding:4px 10px;cursor:pointer}
.mod:hover{color:var(--fg)}
.mod[aria-pressed="true"]{background:var(--accent);color:#14171b;font-weight:500}
.mod:focus-visible,.tab:focus-visible,.btn:focus-visible,.node:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.main{display:grid;grid-template-columns:1fr minmax(320px,430px);min-height:0}
.stage{position:relative;overflow:hidden;min-width:0;touch-action:none;cursor:grab;
  background-color:var(--ground);
  background-image:linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px),linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);}
.stage.dragging{cursor:grabbing}
svg#canvas{width:100%;height:100%;display:block}
.crumb{position:absolute;left:14px;top:12px;font-size:12px;color:var(--muted);pointer-events:none;display:flex;gap:8px;align-items:center}
.crumb b{color:var(--fg);font-weight:500}
.tools{position:absolute;right:12px;top:10px;display:flex;gap:6px}
.btn{font:inherit;font-size:12px;color:var(--fg);background:var(--panel-2);border:1px solid var(--node-border);border-radius:5px;padding:4px 9px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.legend{position:absolute;left:12px;bottom:12px;background:rgba(26,30,35,.92);border:1px solid var(--line);border-radius:6px;padding:8px 10px;display:grid;grid-template-columns:repeat(2,auto);gap:4px 14px;font-family:var(--f-code);font-size:11px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.hint{position:absolute;right:12px;bottom:12px;font-size:11px;color:var(--muted);text-align:right;pointer-events:none}
/* graph */
.node rect.body{fill:var(--node);stroke:var(--node-border);stroke-width:1}
.node.sel rect.body{stroke:var(--accent);stroke-width:2}
.node{cursor:pointer}
.node text{font-family:var(--f-code);font-size:12px;fill:var(--fg)}
.node .ttl{font-family:var(--f-ui);font-size:13px;font-weight:700;fill:#fff}
.node .sub{font-size:10.5px;fill:#ffffffaa}
.node .pl{fill:#c3cad1}
.node .drill{font-size:11px;fill:#fff}
.wire{fill:none;stroke-width:2.2;opacity:.85;transition:opacity .15s}
.wire.exec{stroke-width:2.6}
.wire.data{stroke-dasharray:7 7;animation:flow 1.1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-28}}
.node.fire rect.body{stroke:#fff;stroke-width:2.5}
.node.done rect.body{stroke:#7fdc8a;stroke-width:1.6}
.particle{pointer-events:none}
.btn.on{background:var(--accent);color:#14171b;border-color:var(--accent)}
svg.focus .wire{opacity:.15}
svg.focus .wire.hot{opacity:1}
svg.focus .node{opacity:.55}
svg.focus .node.near,svg.focus .node.sel{opacity:1}
.cmt rect{fill:#ffffff06;stroke:#ffffff22;stroke-dasharray:5 4}
.cmt text{font-family:var(--f-ui);font-size:13px;fill:#ffffff88}
/* panel */
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;min-width:0;padding-block:18px 40px;padding-left:20px;padding-right:max(20px,env(safe-area-inset-right,0px))}
aside .kind{display:inline-block;font-family:var(--f-code);font-size:10.5px;padding:2px 7px;border-radius:3px;color:#fff;letter-spacing:.04em}
aside h2{font-size:19px;margin:10px 0 4px;font-family:var(--f-code);font-weight:600;word-break:break-word;text-wrap:balance}
aside .loc{font-family:var(--f-code);font-size:11.5px;color:var(--accent);text-decoration:none}
aside .loc:hover{text-decoration:underline}
aside h3{font-size:11.5px;letter-spacing:.12em;color:var(--muted);font-weight:500;margin:22px 0 8px;text-transform:uppercase}
aside p{line-height:1.75;margin:0 0 10px;max-width:62ch}
aside p code,aside li code{font-family:var(--f-code);font-size:12px;background:var(--panel-2);padding:1px 5px;border-radius:3px;color:#e9d9a6}
pre{background:#0f1215;border:1px solid var(--line);border-radius:6px;padding:12px;overflow-x:auto;font-family:var(--f-code);font-size:12px;line-height:1.6;margin:0;color:#cfd6dc}
pre .k{color:#c792ea}.pre .c{color:#6b7782}pre .n{color:#f2c744}
.sig{color:#9fd3ff}
details{border:1px solid var(--line);border-radius:6px;margin-bottom:8px;background:var(--panel-2)}
summary{cursor:pointer;padding:9px 12px;line-height:1.55;list-style:none;font-weight:500}
summary::-webkit-details-marker{display:none}
summary::before{content:"问";font-family:var(--f-code);font-size:10px;color:#14171b;background:var(--t-vec3);border-radius:3px;padding:1px 5px;margin-right:8px;vertical-align:1px}
details[open] summary{border-bottom:1px solid var(--line)}
details .ans{padding:10px 12px 4px;line-height:1.75}
.drillbtn{margin-top:14px;font:inherit;font-weight:500;color:#14171b;background:var(--accent);border:0;border-radius:5px;padding:7px 14px;cursor:pointer}
.empty{color:var(--muted);line-height:1.8}
.formula{font-family:var(--f-code);font-size:12.5px;background:#0f1215;border:1px dashed var(--line);border-radius:6px;padding:9px 12px;margin:6px 0 12px;color:#ffe9a8;overflow-x:auto;white-space:nowrap}
@media (max-width: 860px){
  body{overflow:auto}
  .app{height:auto}
  .main{grid-template-columns:1fr}
  .stage{height:62vh;min-height:380px}
  aside{border-left:0;border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .legend{display:none}
}
@media (prefers-reduced-motion: reduce){.wire{transition:none}.wire.data{animation:none}}
</style>

</head>
<body>
<div class="app">
  <header>
    <h1>TinyRender 蓝图<small>L1nkkkk/Rasterizer-render</small></h1>
    <nav class="mods" id="mods" aria-label="模块"></nav>
    <nav class="tabs" id="tabs" role="tablist" aria-label="本模块的图"></nav>
  </header>
  <div class="main">

      <svg id="canvas" aria-label="函数蓝图画布"><defs><filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="3.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><g id="view"></g></svg>
      <div class="crumb" id="crumb"></div>

      </div>

    </div>
    <aside id="panel" aria-live="polite"></aside>
  </div>
</div>

<script>
const GH = "https://github.com/L1nkkkk/Rasterizer-render/blob/main/";
const TYPES = {exec:"--t-exec",Mat4:"--t-mat",Vec4:"--t-vec3",Vec3:"--t-vec3",Vec2:"--t-vec2",float:"--t-float",int:"--t-int",bool:"--t-bool",struct:"--t-struct",Color:"--t-color",Fn:"--t-fn"};
const TYPE_NAMES = [["exec","执行流"],["Mat4","矩阵"],["Vec3","向量 3/4"],["Vec2","向量 2"],["float","float"],["int","int"],["bool","bool"],["struct","结构体"],["Color","颜色"],["Fn","函数对象"]];
const KIND = {event:["事件 / 入口","--h-event"],func:["函数","--h-func"],pure:["纯函数 / 计算","--h-pure"],macro:["子图","--h-macro"],branch:["分支","--h-branch"],par:["并行","--h-par"]};
const cssv = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- graphs ---------- */
const GRAPHS = [
 {id:"frame",lvl:"L1",name:"一帧总览",parent:null,
  intro:`<p><code>Render::renderScene</code> 是一帧的入口。整体结构是<b>单线程几何阶段 + 可选的并行像素阶段</b>：先在调用线程上把所有三角形变换、裁剪、准备好，再按 <code>raster_mode</code> 选择顺序光栅化或 tile 并行光栅化。</p><p>带 <b>子图</b> 标记的节点可以双击进入函数级拆解。建议的阅读顺序：矩阵与顶点变换 → 裁剪与三角形准备 → 逐像素光栅化 → 着色 → Tile 并行。</p>`},
 {id:"xform",lvl:"L2",name:"矩阵与顶点变换",parent:"frame",
  intro:`<p>这张图对应 <code>renderScene</code> 里每个模型、每个三角形的变换部分，以及四个矩阵构造函数。核心思想：矩阵<b>每个模型算一次</b>，顶点<b>每个三角形算三次</b>。</p>`},
 {id:"clip",lvl:"L2",name:"裁剪与三角形准备",parent:"frame",
  intro:`<p>把裁剪空间的三角形变成"可以直接扫像素"的 <code>PreparedTriangle</code>：齐次裁剪 → 透视除法 → 视口变换 → 面积与绕序 → 包围盒 → top-left 标记。所有逐三角形的常量都在这里预先算好，像素循环里只做加乘。</p>`},
 {id:"raster",lvl:"L2",name:"逐像素光栅化",parent:"frame",
  intro:`<p><code>rasterizePreparedTriangle</code> 是热点函数，2048² 的测试场景里一帧 99% 的时间花在这里。对包围盒内每个像素中心：边函数判断是否在三角形内 → 深度插值与深度测试 → 透视校正插值属性 → 调用着色器 → 写颜色和深度。</p>`},
 {id:"shade",lvl:"L3",name:"Blinn-Phong 着色",parent:"raster",
  intro:`<p><code>BlinnPhongShader::shade</code> 对一个像素算颜色。流程：采样贴图并转到线性空间 → 取法线（插值法线或对象空间法线贴图）→ 对每盏点光源累加漫反射和高光 → 转回 sRGB 输出。</p>`},
 {id:"tiles",lvl:"L2",name:"Tile 并行",parent:"frame",
  intro:`<p>并行模式的核心设计：<b>每个 tile 只归一个线程</b>，像素写入不需要锁或原子操作；tile 内三角形保持提交顺序，所以输出和顺序版本逐位一致。参考机器（i7-12700KF，20 线程）上整帧中位数 340.7 ms → 33.7 ms，约 10.1 倍。</p>`}
];

/* node: [id, graph, x, y, w, kind, title, sub, ins, outs, drill, info] ; pins "name:Type" */
const N = [];
function node(o){N.push(o)}

/* ===== frame ===== */
node({id:"ev",g:"frame",x:40,y:180,w:200,k:"event",t:"renderScene",s:"每帧入口",outs:["▶:exec","scene:struct"],
 info:{loc:"render.cpp#L311",sig:"RenderProfile Render::renderScene(const Scene& scene)",
 what:`<p>一帧的总调度。持有 <code>frame_mutex_</code>，所以同一个 <code>Render</code> 对象不能被两个线程同时调用。每个阶段都用 <code>steady_clock</code> 打点，结果写进 <code>RenderProfile</code>（clear / setup / binning / raster / cleanup / total）。</p>`,
 code:`std::lock_guard<std::mutex> frame_lock(frame_mutex_);
// 1. 校验：渲染目标不能同时被当作贴图采样
// 2. clearFrame
// 3. view_projection = P * V（每帧一次）
// 4. 对每个模型：M、法线矩阵、MVP（每模型一次）
//    对每个三角形：变换 → clipTriangle → prepareTriangle
// 5. Sequential：直接光栅化
//    TiledParallel：分箱 → parallelFor(tile)`,
 why:`<p>几何阶段（setup）只花约 1.6 ms，像素阶段约 337 ms（顺序模式，2048×2048，2492 个三角形，两盏灯，三张贴图）。所以只并行像素阶段就够了，这是一个由数据驱动的取舍。</p>`,
 qa:[["为什么几何阶段不做并行？","按 Amdahl 定律，可并行部分的占比决定上限。setup 占整帧不到 1%，并行它几乎没有收益，还会引入三角形列表合并的同步开销。像素阶段占 99%，才是值得并行的部分。如果场景换成百万三角形、低分辨率，结论就会反过来。"],
 ["这一帧里哪些东西是每帧、每模型、每三角形、每像素算的？","每帧：view_projection。每模型：model 矩阵、法线矩阵、MVP。每三角形：3 个顶点变换、裁剪、PreparedTriangle 的常量（面积、包围盒、top-left 标记）。每像素：3 个边函数、重心坐标、深度、透视校正属性、着色。把计算尽量往外层提，是光栅化器优化的基本思路。"]]}});
node({id:"val",g:"frame",x:300,y:150,w:200,k:"func",t:"校验渲染目标",s:"内联 · 防读写冲突",ins:["▶:exec","scene:struct"],outs:["▶:exec"],
 info:{loc:"render.cpp#L318",sig:"// renderScene 内联循环",
 what:`<p>遍历所有三角形，确认 diffuse / normal / specular 贴图都不是当前的渲染目标 <code>image_</code>，否则抛异常。</p>`,
 code:`if (primitive.diffuse_map == &image_ || primitive.normal_map == &image_ ||
    primitive.specular_map == &image_) {
    throw std::invalid_argument("The render target cannot also be sampled as a texture");
}`,
 why:`<p>一边写一张图一边从同一张图采样，结果取决于写入顺序，并行时更是数据竞争。GPU 上这叫 feedback loop，图形 API 同样不允许把同一纹理同时绑定为采样源和渲染目标。</p>`,qa:[]}});
node({id:"clr",g:"frame",x:560,y:150,w:190,k:"func",t:"clearFrame",s:"深度 = +∞",ins:["▶:exec"],outs:["▶:exec","depth:float"],
 info:{loc:"render.cpp#L101",sig:"void Render::clearFrame(const TGAColor& clear_color)",
 what:`<p>深度缓冲填 <code>+∞</code>，颜色缓冲填清屏色。清屏色是纯黑时走 <code>image_.clear()</code> 快速路径（整块置零），否则逐像素写。</p>`,
 code:`std::fill(depth_buffer_.begin(), depth_buffer_.end(),
          std::numeric_limits<float>::infinity());
if (clear_color is black ...) { image_.clear(); return; }`,
 why:`<p>深度测试用的是"新深度 &lt; 旧深度才通过"，初始化成 +∞ 保证第一个覆盖的片元一定通过。在 2048² 下 clear 本身要约 1.9 ms，比整个几何阶段还贵。</p>`,
 qa:[["clear 为什么这么贵？还能怎么优化？","2048×2048 的 float 深度缓冲是 16 MB，颜色 12 MB，纯粹是内存带宽。优化思路：tile 并行时让每个 tile 在自己的线程里清自己的区域；或者像 GPU 那样用 tile 级的 clear 标记（fast clear），首次写入时才真正初始化。"]]}});
node({id:"xf",g:"frame",x:810,y:150,w:230,k:"macro",t:"矩阵与顶点变换",s:"每模型 / 每三角形",ins:["▶:exec","scene:struct"],outs:["▶:exec","tri:VertexOut[3]:struct","normal_m:Mat4"],drill:"xform",
 info:{loc:"render.cpp#L333",sig:"// renderScene 第 333–360 行",
 what:`<p>算出 view_projection，再对每个模型算 M、法线矩阵和 MVP；对每个三角形的 3 个顶点，输出裁剪空间位置、世界空间位置、世界空间法线和 UV，打包成 <code>VertexOut[3]</code>。</p>`,code:"",why:"",qa:[]}});
node({id:"cl",g:"frame",x:1100,y:130,w:230,k:"func",t:"clipTriangle",s:"齐次空间 6 平面裁剪",ins:["▶:exec","tri:VertexOut[3]:struct"],outs:["▶:exec","tris:VertexOut[3][]:struct"],drill:"clip",
 info:{loc:"render.cpp#L113",sig:"static std::vector<std::array<VertexOut,3>> Render::clipTriangle(const std::array<VertexOut,3>&)",
 what:`<p>一个三角形进，0 到多个三角形出（裁剪后最多 9 边形，扇形拆成最多 7 个三角形）。详见子图。</p>`,code:"",why:"",qa:[]}});
node({id:"pr",g:"frame",x:1390,y:130,w:250,k:"func",t:"prepareTriangle",s:"屏幕空间常量预计算",ins:["▶:exec","tri:VertexOut[3]:struct","primitive:Triangle:struct","normal_m:Mat4"],outs:["▶:exec","prepared:PreparedTriangle:struct","ok:bool"],drill:"clip",
 info:{loc:"render.cpp#L170",sig:"bool Render::prepareTriangle(const std::array<VertexOut,3>&, const Triangle&, const Matrix4f&, PreparedTriangle&) const",
 what:`<p>透视除法、视口变换、面积、绕序统一、包围盒、top-left 标记。退化或完全在屏幕外的三角形返回 false 直接丢弃。详见子图。</p>`,code:"",why:"",qa:[]}});
node({id:"br",g:"frame",x:1700,y:170,w:200,k:"branch",t:"Branch",s:"options_.raster_mode",ins:["▶:exec","mode:int"],outs:["Sequential:exec","TiledParallel:exec"],
 info:{loc:"render.cpp#L377",sig:"if (options_.raster_mode == RasterMode::Sequential) { ... } else { ... }",
 what:`<p>两条路径共用完全相同的 <code>PreparedTriangle</code> 列表和同一个像素函数，区别只在"谁来扫哪些像素"。这让 A/B benchmark 是公平的：变量只有调度方式。</p>`,code:"",why:"",
 qa:[["为什么要保留顺序模式？","它是正确性和性能的基线。测试里每帧都比较顺序和并行的颜色、深度缓冲是否完全相同；benchmark 也是 A/B 交替测这两种模式。"]]}});

node({id:"gv",g:"xform",x:40,y:40,w:220,k:"pure",t:"getViewMatrix",s:"右手 lookAt",ins:["camera:struct"],outs:["V:Mat4"],
 info:{loc:"render.cpp#L513",sig:"Matrix4f Render::getViewMatrix(const Camera& camera) const",
 what:`<p>用相机朝向构造正交基：<code>right = forward × up</code>，<code>up = right × forward</code>。矩阵的三行是 right、up、-forward，平移列是它们和相机位置的负点积。</p>`,
 code:`const Vector3f forward = camera.forward.normalize();
const Vector3f right = forward.cross(camera.up).normalize();
const Vector3f up = right.cross(forward).normalize();
return { {right, -right·pos}, {up, -up·pos},
         {-forward, forward·pos}, {0,0,0,1} };`,
 why:`<p>右手坐标系里相机看向 <b>-Z</b>，所以第三行放的是 -forward。旋转部分是正交矩阵，它的逆就是转置，所以视图矩阵 = 转置的旋转 × 反向平移，不需要求逆。</p>`,
 qa:[["up 为什么要重新叉乘一遍？","用户给的 up 不一定和 forward 垂直，直接用会得到非正交的基。先用 forward × up 得到 right，再用 right × forward 得到真正垂直的 up，这就是 Gram-Schmidt 的叉乘版本。forward 和 up 平行时 right 会退化成零向量，这是 lookAt 的经典边界情况。"]]}});
node({id:"gp",g:"xform",x:40,y:200,w:220,k:"pure",t:"getProjectionMatrix",s:"OpenGL 风格透视",ins:["camera:struct"],outs:["P:Mat4"],
 info:{loc:"render.cpp#L525",sig:"Matrix4f Render::getProjectionMatrix(const Camera& camera) const",
 what:`<p>标准 OpenGL 透视矩阵，把视锥映射到 NDC 立方体 [-1,1]³。先校验 fov、宽高比、near/far 合法，否则抛异常。</p>`,
 code:`const float f = 1.0f / std::tan(fov_degrees * kPi / 360.0f);
return { {f/aspect, 0, 0, 0},
         {0, f, 0, 0},
         {0, 0, -(far+near)/(far-near), -2*far*near/(far-near)},
         {0, 0, -1, 0} };   // w_clip = -z_view`,
 why:`<p>最后一行让 <code>w = -z_view</code>，即"到相机的距离"，透视除法就是除以它。z 经过除法后变成 1/z 的形式，所以 NDC 深度是非线性的。</p>`,
 formula:"z_ndc = (A·z + B) / (-z),  A = -(f+n)/(f-n),  B = -2fn/(f-n)",
 qa:[["NDC 深度为什么是非线性的？有什么后果？","z_ndc 和 1/z 成线性关系，精度大量集中在近平面附近，远处深度精度很差，容易 z-fighting。near 越小越严重。工业界常见改进是 reversed-Z：把 near 映射到 1、far 映射到 0，配合浮点数在 0 附近精度更高的特性，让远处精度大幅改善。"],
 ["fov 为什么除以 360 而不是 180？","需要的是半角的正切：tan(fov/2)，而角度转弧度乘 π/180，合起来就是 fov·π/360。"]]}});
node({id:"vp",g:"xform",x:330,y:120,w:200,k:"pure",t:"P × V",s:"view_projection · 每帧一次",ins:["P:Mat4","V:Mat4"],outs:["VP:Mat4"],
 info:{loc:"render.cpp#L333",sig:"const Matrix4f view_projection = getProjectionMatrix(cam) * getViewMatrix(cam);",
 what:`<p>每帧只算一次，所有模型共用。</p>`,code:"",why:`<p>矩阵乘法结合律让我们可以把 P·V·M 提前合成一个矩阵，每个顶点只做一次 4×4 乘法，而不是三次。</p>`,qa:[]}});
node({id:"gm",g:"xform",x:40,y:370,w:220,k:"pure",t:"getModelMatrix",s:"T · Rz · Ry · Rx · S",ins:["model:struct"],outs:["M:Mat4"],
 info:{loc:"render.cpp#L441",sig:"Matrix4f Render::getModelMatrix(const Model& model) const",
 what:`<p>由模型的缩放、欧拉角旋转（度）和平移构造模型矩阵。</p>`,
 code:`return translation * rotation_z * rotation_y * rotation_x * scale;`,
 why:`<p>矩阵作用在列向量上（<code>M * v</code>），所以<b>最右边的最先作用</b>：先缩放，再依次绕 X、Y、Z 旋转，最后平移。如果先平移再缩放，平移量也会被缩放，物体会"飞走"。</p>`,
 qa:[["为什么 S 必须在最右边、T 在最左边？","缩放和旋转应该围绕物体自身原点进行。如果平移先作用，后面的旋转就会绕世界原点转，物体会在世界里画圆，而不是原地转。"],
 ["欧拉角有什么问题？","万向节死锁：当中间那个轴（这里是 Y）转到 ±90° 时，X 和 Z 的旋转轴重合，丢失一个自由度。插值时也不平滑。引擎里通常用四元数存旋转。"]]}});
node({id:"gn",g:"xform",x:330,y:400,w:220,k:"pure",t:"getNormalMatrix",s:"(M₃ₓ₃)⁻¹ 的转置",ins:["M:Mat4"],outs:["N:Mat4"],
 info:{loc:"render.cpp#L480",sig:"Matrix4f Render::getNormalMatrix(const Matrix4f& model_matrix) const",
 what:`<p>只取 M 左上 3×3，用<b>余子式除以行列式</b>直接算出逆转置：<code>result[i][j] = 余子式(i,j) / det</code>。行列式太小（相对于系数量级）时返回单位阵。</p>`,
 code:`result[0][0] = (a11*a22 - a12*a21) * inv_det;
result[0][1] = (a12*a20 - a10*a22) * inv_det;
...
// 退化判定是相对的：|det| <= eps * scale³`,
 why:`<p>伴随矩阵是余子式矩阵的转置，A⁻¹ = adj(A)/det。所以"余子式矩阵 / det"恰好等于 (A⁻¹)ᵀ，省掉了先求逆再转置两步。退化阈值乘了 <code>scale³</code>，因为 3×3 行列式随矩阵整体缩放按三次方变化，这样判断和模型尺寸无关。</p>`,
 formula:"n' = (M⁻¹)ᵀ · n",
 qa:[["法线为什么不能直接乘模型矩阵？","非均匀缩放会破坏垂直关系。比如把一个圆在 x 方向拉长成椭圆，直接用 M 变换法线，法线会朝 x 方向倾斜，不再垂直于表面。推导：切线 t 满足 nᵀt = 0，变换后 t' = Mt，要保持 n'ᵀt' = 0，就需要 n' = (M⁻¹)ᵀ n。"],
 ["什么情况下可以直接用 M？","只有旋转和均匀缩放时，(M⁻¹)ᵀ 和 M 只差一个标量倍数，归一化后结果一样。很多引擎会对这种情况走快速路径。"]]}});
node({id:"mvp",g:"xform",x:620,y:360,w:200,k:"pure",t:"VP × M",s:"MVP · 每模型一次",ins:["VP:Mat4","M:Mat4"],outs:["MVP:Mat4"],
 info:{loc:"render.cpp#L341",sig:"const Matrix4f mvp = view_projection * model_matrix;",what:`<p>每个模型算一次，该模型所有顶点共用。</p>`,code:"",why:"",qa:[]}});
node({id:"td",g:"xform",x:620,y:470,w:220,k:"pure",t:"transformDirection",s:"w = 0，忽略平移",ins:["N:Mat4","n_obj:Vec3"],outs:["n_world:Vec3"],
 info:{loc:"render.cpp#L51",sig:"Vector3f transformDirection(const Matrix4f& matrix, const Vector3f& direction)",
 what:`<p>把方向扩展成齐次坐标 <code>(x,y,z,0)</code> 后乘矩阵，再归一化。</p>`,
 code:`const Vector4f t = matrix * Vector4f(direction, 0.0f);
return Vector3f(t.x, t.y, t.z).normalize();`,
 why:`<p>w = 0 时矩阵最后一列（平移）不起作用，因为方向没有位置，不该被平移。归一化是因为逆转置矩阵一般会改变长度。</p>`,qa:[]}});
node({id:"vt",g:"xform",x:910,y:220,w:260,k:"func",t:"逐顶点变换",s:"内联 · 每三角形 ×3",ins:["▶:exec","MVP:Mat4","M:Mat4","n_world:Vec3","primitive:Triangle:struct"],outs:["▶:exec","tri:VertexOut[3]:struct"],
 info:{loc:"render.cpp#L343",sig:"// for (const Triangle& primitive : model.faces) { ... }",
 what:`<p>对三角形的每个顶点生成一个 <code>VertexOut</code>：裁剪空间位置、世界空间位置、世界空间法线、UV。模型没有顶点法线时退回到面法线。</p>`,
 code:`transformed[i] = {
    mvp * object_position,                         // clip_position
    Vector3f(world4.x, world4.y, world4.z) / world_w, // world_position
    transformDirection(normal_matrix, object_normal),  // world_normal
    primitive.uv_coords[i]
};`,
 why:`<p>这就是软件版的 vertex shader。世界空间位置和法线留给着色阶段算光照，裁剪空间位置用于后面的裁剪和光栅化。</p>`,
 qa:[["为什么着色在世界空间做，而不是视图空间？","都可以，只要光源、相机、片元在同一空间。世界空间的好处是光源位置不用每帧变换；视图空间的好处是相机永远在原点，view 向量好算。GPU 管线里两种都常见。"]]}});

/* ===== clip ===== */
node({id:"cd",g:"clip",x:40,y:40,w:220,k:"pure",t:"clipDistance",s:"到第 i 个裁剪面的距离",ins:["v:VertexOut:struct","plane:int"],outs:["d:float"],
 info:{loc:"render.cpp#L25",sig:"float clipDistance(const VertexOut& vertex, int plane)",
 what:`<p>六个平面对应 <code>-w ≤ x,y,z ≤ w</code>。返回 <code>w ± 分量</code>，≥ 0 表示在该平面内侧。</p>`,
 code:`case 0: return p.w + p.x;   // 左   x >= -w
case 1: return p.w - p.x;   // 右   x <=  w
case 2: return p.w + p.y;   // 下
case 3: return p.w - p.y;   // 上
case 4: return p.w + p.z;   // 近
default: return p.w - p.z;  // 远`,
 why:`<p>在除以 w 之前判断，所以不需要担心 w 为 0 或负数。这些距离在裁剪空间里是线性的，可以直接用来求交点参数 t。</p>`,qa:[]}});
node({id:"ip",g:"clip",x:40,y:220,w:220,k:"pure",t:"interpolate",s:"所有属性线性插值",ins:["a:VertexOut:struct","b:VertexOut:struct","t:float"],outs:["v:VertexOut:struct"],
 info:{loc:"render.cpp#L16",sig:"VertexOut interpolate(const VertexOut& a, const VertexOut& b, float t)",
 what:`<p>位置、世界坐标、法线、UV 全部按 <code>(1-t)·a + t·b</code> 插值，生成裁剪边上的新顶点。</p>`,code:"",
 why:`<p>裁剪空间坐标是物体空间坐标的线性（仿射）变换，还没做透视除法，所以在这里线性插值所有属性都是正确的。如果在除以 w 之后再插值，就需要透视校正。</p>`,qa:[]}});
node({id:"ct",g:"clip",x:330,y:110,w:240,k:"func",t:"clipTriangle",s:"Sutherland–Hodgman",ins:["▶:exec","tri:VertexOut[3]:struct","d:float","split:VertexOut:struct"],outs:["▶:exec","tris:VertexOut[3][]:struct"],
 info:{loc:"render.cpp#L113",sig:"static std::vector<std::array<VertexOut,3>> Render::clipTriangle(const std::array<VertexOut,3>& triangle)",
 what:`<p>把三角形当作多边形，依次对 6 个平面做 Sutherland–Hodgman：遍历每条边，内→内保留终点，内→外只保留交点，外→内保留交点和终点。最后把多边形扇形拆成三角形。</p>`,
 code:`for (int plane = 0; plane < 6 && !polygon.empty(); ++plane) {
    for (const VertexOut& current : polygon) {
        if (previous_inside != current_inside) {
            t = previous_distance / (previous_distance - current_distance);
            clipped.push_back(interpolate(previous, current, t));
        }
        if (current_inside) clipped.push_back(current);
        ...
    }
    polygon = std::move(clipped);
}
// 扇形拆分：(0, i, i+1)`,
 why:`<p>交点参数 <code>t = d_prev / (d_prev - d_cur)</code> 来自距离在边上线性变化、在交点处为 0。一个三角形被 6 个平面切，每个平面最多加一个顶点，最多变成 9 边形。</p>`,
 qa:[["为什么要在齐次空间裁剪，而不是除以 w 之后？","相机后方的顶点 w < 0，除以 w 后坐标符号翻转，会被投影到屏幕另一侧，产生跨越整个屏幕的错误三角形；w 接近 0 时还会除零。所以至少近平面必须在透视除法之前裁掉。"],
 ["GPU 真的裁六个面吗？这里有什么可以改进的？","GPU 一般只严格裁近平面（和远平面），x/y 方向用 guard band：只要三角形在一个比屏幕大得多的范围内，就交给光栅化阶段的包围盒和 scissor 处理，不产生新三角形。这个实现裁全部 6 个面，简单正确，但屏幕边缘的三角形会被切出额外的三角形。由于后面包围盒已经 clamp 到屏幕范围，x/y 的裁剪其实可以省掉。"],
 ["为什么用 kEpsilon 判断内侧？","d ≥ -ε 视为在内，避免恰好落在平面上的顶点因浮点误差被反复切出极小的碎三角形。"]]}});
node({id:"pd",g:"clip",x:650,y:20,w:240,k:"pure",t:"透视除法 + 视口变换",s:"prepareTriangle 前半段",ins:["clip_pos:Vec4"],outs:["screen:Vec2","inv_w:float","ndc_z:float"],
 info:{loc:"render.cpp#L178",sig:"// prepareTriangle 第 177–193 行",
 what:`<p>除以 w 得到 NDC，再映射到像素坐标。y 轴翻转，因为图像第 0 行在顶部。同时保存 <code>1/w</code> 和 <code>z/w</code> 供后面插值使用。</p>`,
 code:`const float inv_w = 1.0f / w;
screen.x = (ndc_x * 0.5f + 0.5f) * width_;
screen.y = (1.0f - (ndc_y * 0.5f + 0.5f)) * height_;
ndc_z    = clip.z * inv_w;`,
 why:`<p><code>1/w</code> 和 <code>z/w</code> 在屏幕空间是<b>线性</b>的，所以可以直接用屏幕重心坐标插值；而 UV、法线这些属性不是线性的，需要用 1/w 做透视校正。保存 inv_w 就是为此。</p>`,qa:[]}});
node({id:"ef",g:"clip",x:650,y:210,w:240,k:"pure",t:"edgeFunction",s:"2D 叉积 = 2 × 有向面积",ins:["a:Vec2","b:Vec2","p:Vec2"],outs:["area:float"],
 info:{loc:"render.cpp#L37",sig:"float edgeFunction(const Vector2f& a, const Vector2f& b, const Vector2f& point)",
 what:`<p>计算向量 ab 和 ap 的 2D 叉积。符号表示 p 在边 ab 的哪一侧，绝对值是三角形 abp 面积的两倍。</p>`,
 code:`return (b.x - a.x) * (point.y - a.y) - (b.y - a.y) * (point.x - a.x);`,
 why:`<p>同一个函数用了两次：在这里算整个三角形的有向面积；在像素循环里对每个像素中心算三次，同时得到"是否在内部"和"重心坐标"。这是 Pineda 光栅化算法的核心，也是 GPU 光栅化的基础。</p>`,
 formula:"E(p) = (b-a) × (p-a)，对 p 是线性函数",
 qa:[["边函数为什么适合硬件？","它对 p 是线性的：x 加 1，E 只加一个常数。所以可以增量计算，也可以对多个像素并行计算，完全没有分支。GPU 用定点数实现它，配合 top-left 规则可以做到精确无缝。"]]}});
node({id:"wd",g:"clip",x:960,y:120,w:220,k:"branch",t:"统一绕序",s:"area < 0 → 交换 v1、v2",ins:["area:float"],outs:["area>0:float"],
 info:{loc:"render.cpp#L196",sig:"if (area < 0.0f) { std::swap(vertices[1], vertices[2]); area = -area; }",
 what:`<p>面积为 0（退化）直接丢弃；面积为负就交换两个顶点，保证后续所有三角形绕序一致、面积为正。</p>`,code:"",
 why:`<p>统一绕序后，像素循环里"三个边函数都 ≥ 0 才算内部"这一条规则对所有三角形都成立，也让 top-left 规则的判断方向固定。</p>`,
 qa:[["这里有背面剔除吗？","没有。负面积的三角形被翻转后照样光栅化，所以正面背面都会画。如果要背面剔除，在这里直接 return false 就行，能省掉大约一半的三角形。面试被问到可以主动指出这一点。"]]}});
node({id:"bb",g:"clip",x:960,y:290,w:220,k:"pure",t:"像素包围盒",s:"clamp 到帧缓冲",ins:["screen×3:Vec2"],outs:["min/max:int"],
 info:{loc:"render.cpp#L208",sig:"// prepareTriangle 第 203–213 行",
 what:`<p><code>min = floor(min_screen)</code>，<code>max = ceil(max_screen) - 1</code>，再 clamp 到 [0, width-1] 和 [0, height-1]。为空则丢弃。</p>`,code:"",
 why:`<p>采样点是像素中心 (x+0.5, y+0.5)。像素 x 的中心落在 [x, x+1) 区间内，所以 ceil(max)-1 是最后一个可能被覆盖的像素。clamp 也顺带承担了屏幕边界的裁剪。</p>`,qa:[]}});
node({id:"tlf",g:"clip",x:960,y:440,w:220,k:"pure",t:"isTopLeftEdge × 3",s:"共享边归属规则",ins:["edges:Vec2"],outs:["top_left:bool[3]:bool"],
 info:{loc:"render.cpp#L41",sig:"bool isTopLeftEdge(const Vector2f& a, const Vector2f& b)",
 what:`<p>判断一条边是不是"上边"或"左边"。在这个仓库的约定下（屏幕 y 向下，面积已统一为正）：<code>dy < 0</code> 是左边，<code>dy == 0 且 dx > 0</code> 是上边。</p>`,
 code:`const float dx = b.x - a.x, dy = b.y - a.y;
return dy < 0.0f || (std::abs(dy) <= kEpsilon && dx > 0.0f);`,
 why:`<p>可以用一个例子验证：a=(0,0)、b=(1,0)、c=(0,1)，面积为正。a→b 水平向右，是上边；c→a 向上（dy<0），是左边（x=0）；b→c 是斜边，在右下方，不是 top-left。和规则判断一致。</p>`,
 qa:[["top-left 规则解决什么问题？","两个三角形共享一条边时，恰好落在边上的像素中心如果两边都画，会重复着色（半透明混合会出错）；如果都不画，会出现裂缝。规则规定：边上的像素只属于把这条边当作上边或左边的那个三角形，保证每个像素被恰好画一次。D3D 和 OpenGL 都用这个规则。"],

node({id:"lp",g:"raster",x:360,y:120,w:220,k:"macro",t:"For y, x",s:"像素中心 (x+0.5, y+0.5)",ins:["▶:exec","range:int"],outs:["循环体:exec","sample:Vec2"],

node({id:"ps",g:"raster",x:930,y:40,w:220,k:"branch",t:"passesEdge × 3",s:"内部测试 + top-left",ins:["▶:exec","e0..e2:float","top_left:bool[3]:bool"],outs:["在内部:exec"],

node({id:"sl",g:"shade",x:330,y:40,w:200,k:"pure",t:"srgbToLinear",s:"贴图解码到线性",ins:["srgb:Vec3"],outs:["linear:Vec3"],

node({id:"lt",g:"shade",x:880,y:160,w:250,k:"macro",t:"For each Light",s:"环境 + Lambert + Blinn",ins:["▶:exec","albedo:Vec3","normal:Vec3","shininess:float"],outs:["▶:exec","linear_color:Vec3"],
 info:{loc:"Shader.cpp#L65",sig:"for (const Light& light : pixel.lights) { ... }",
 what:`<p>先给一个很小的环境光 <code>0.035 × albedo</code>，再对每盏点光源累加漫反射和高光。</p>`,
 code:`radiance = light.intensity / distance_squared;        // 平方反比衰减
n_dot_l  = max(0, N·L);
color   += albedo * radiance * n_dot_l;                 // Lambert
if (n_dot_l > 0) {
    H = normalize(V + L);
    color += radiance * 0.35 * pow(max(0, N·H), shininess); // Blinn
}`,
 formula:"L_o = 0.035·ρ + Σ (E/d²) · [ ρ·max(0,N·L) + 0.35·max(0,N·H)^s ]",

 qa:[["Blinn-Phong 和 Phong 的区别？","Phong 用反射向量 R 和视线 V 的夹角；Blinn 用半程向量 H 和法线 N 的夹角。H 更便宜（不用算反射），而且在掠射角下 R·V 可能超过 90° 导致高光突然截断，N·H 不会。同样的视觉效果，Blinn 的指数大约要是 Phong 的 4 倍。"],
 ["这个模型哪些地方不符合物理？","不能量守恒（漫反射加高光可能超过入射能量）；没有 Fresnel；环境光是常数；高光指数是经验参数。PBR 用微表面 BRDF（GGX + Schlick Fresnel + Smith 几何项）解决这些问题，你的 OpenGL 项目就是 PBR。"]]}});

GRAPHS.unshift({id:"repo",mod:"overview",lvl:"L0",name:"仓库总览",parent:null,
 intro:`<p>TinyRender 是一个纯 CPU 渲染器，三条渲染路径（光栅化、Whitted 光追、路径追踪）共享同一套场景、三角形、材质、图像和线程池。这张图是整个仓库的模块地图，每个模块节点都可以双击进入。</p><p>建议阅读顺序：光栅化 → BVH 与求交 → 光追积分器 → SDF → 参与介质 → 网格转 SDF。后面的模块依赖前面的。</p>`});
GRAPHS.push(
 {id:"bvhbuild",mod:"bvh",lvl:"L1",name:"BVH 构建",parent:"repo",intro:`<p>把场景展平成世界空间三角形，再自顶向下递归构建二叉 BVH。每个内部节点要么用分桶 SAH 选划分面，要么退回中位数划分。参考机器上，16 桶 SAH 相比中位数划分让 Whitted 场景的三角形测试减少 88.3%，单线程光追内核快 3.78 倍。</p>`},
 {id:"bvhtrav",mod:"bvh",lvl:"L1",name:"遍历与求交",parent:"repo",intro:`<p>用显式栈做前序遍历：先测 AABB（slab 方法），叶子里测三角形（Möller–Trumbore），内部节点把近的子节点后压栈先访问，命中后用最近距离剪枝。阴影线走单独的 any-hit 版本，找到任何遮挡就返回。</p>`},
 {id:"rframe",mod:"integ",lvl:"L1",name:"光追一帧",parent:"repo",intro:`<p><code>RayRenderer::renderScene</code>：校验场景 → 每帧重建 BVH 和面光源表 → 按 tile 并行，每个像素每个样本独立播种 RNG → Whitted 或路径追踪 → 线性 HDR 累加 → ACES 色调映射。多线程和单线程输出逐位一致。</p>`},
 {id:"whitted",mod:"integ",lvl:"L2",name:"Whitted 光追",parent:"rframe",intro:`<p>经典 Whitted 风格递归：漫反射只算直接光照，金属递归反射，玻璃同时递归反射和折射并用 Fresnel 加权。面光源用 4 个固定分层样本，所以有软阴影但没有噪点。参考机器 20 线程加速 11.44 倍。</p>`},
 {id:"path",mod:"integ",lvl:"L2",name:"路径追踪",parent:"rframe",intro:`<p>迭代式（非递归）蒙特卡洛路径追踪：漫反射面做 NEE（下一事件估计）加余弦加权采样，金属和玻璃随机选一个方向，深度 ≥ 3 后俄罗斯轮盘赌。固定种子下 1 线程和 N 线程结果逐位一致，20 线程加速 10.17 倍。</p>`},
 {id:"sdfeval",mod:"sdf",lvl:"L1",name:"距离场与 CSG",parent:"repo",intro:`<p>SDF 用一棵不可变的表达式树表示：叶子是解析基本体或采样网格，内部节点是并、交、差、平滑并。每个节点同时维护保守包围盒和 Lipschitz 上界，供 sphere tracing 安全步进使用。</p>`},
 {id:"sphere",mod:"sdf",lvl:"L1",name:"Sphere Tracing",parent:"repo",intro:`<p><code>intersectSdfObject</code>：先用包围盒裁剪光线区间，再按 |d|/L 步进；进入容差带后用中心差分求法线并做一步牛顿精修。多个 SDF 物体取最近，最后与三角形 BVH 的结果比较。</p>`},
 {id:"volpath",mod:"vol",lvl:"L1",name:"体积路径追踪",parent:"repo",intro:`<p>均匀介质用轴对齐盒子表示。每段光线先收集经过的介质区间，采样一个单位速率的光学深度，逐区间扣减，落在某个区间里就发生散射事件，否则继续走表面分支。介质事件处做 NEE，阴影线乘 Beer–Lambert 透射率。</p>`},
 {id:"meshsdf",mod:"mesh",lvl:"L1",name:"网格转 SDF",parent:"repo",intro:`<p>把斯坦福兔子烘焙成符号距离场：先检查拓扑并补洞，变成闭合流形；然后对每个网格节点用 BVH 求最近点得到无符号距离，再沿三个方向数穿越次数做奇偶投票定符号；最后截断并压成稀疏 brick。</p>`}
);

node({id:"b_sah",g:"bvhbuild",x:960,y:250,w:240,k:"pure",t:"findSahSplit",s:"3 轴 × 16 桶 · 前后缀扫描",ins:["bounds:struct","centroid_bounds:struct"],outs:["split:struct"],

 what:`<p>对每个轴：按质心把三角形分进 16 个桶，记录每个桶的包围盒和数量；从右往左扫一遍得到后缀包围盒和数量，再从左往右扫一遍，对 15 个候选划分面计算代价，取全局最小。</p>`,
 code:`for (split = 0; split + 1 < bin_count; ++split) {
    left_count += bins[split].count;
    left_bounds.expand(bins[split].bounds);

 formula:"C = C_trav + ( SA(L)·N_L + SA(R)·N_R ) / SA(P) · C_isect，这里 C_trav = C_isect = 1",
 why:`<p>前后缀扫描让每个轴的代价是 O(N + B) 而不是 O(N·B)。分桶是对「尝试每个三角形位置作为划分面」的近似，精度损失很小，构建快得多。</p>`,
 qa:[["SAH 的代价公式是怎么来的？","假设光线在空间中均匀分布，一条已经穿过父节点的光线再穿过子节点的条件概率约等于两者表面积之比 SA(子)/SA(父)。所以期望代价 = 遍历当前节点的代价 + 进入左子的概率 × 左边的求交代价 + 进入右子的概率 × 右边的求交代价。它是一个贪心的局部估计，假设子节点都是叶子。"],
 ["为什么 SAH 比中位数划分好这么多？","中位数只保证数量平衡，不管空间分布。比如 Cornell 场景里墙壁是几个大三角形、物体是很多小三角形，中位数划分会切出大量互相重叠、包围盒很大的节点；SAH 倾向于把空旷的空间切出去，让光线能尽早剔除。实测三角形测试减少 88.3%。"],
 ["SAH 构建更慢，什么时候不划算？","兔子场景里 SAH 构建约慢 3.6 倍，但每帧重建的整帧仍然快 1.317 倍，因为渲染时间远大于构建时间。如果是每帧光线很少、几何频繁变化的场景（比如动态物体），就要权衡：常用折中是 LBVH（Morton 码排序，GPU 上极快）加局部优化，或者只对静态部分用 SAH。"]]}});

node({id:"t_slab",g:"bvhtrav",x:570,y:360,w:230,k:"pure",t:"AABB::intersect",s:"slab 方法 · double 计算",ins:["ray:struct","bounds:struct"],outs:["hit:bool","t_enter:float"],

 what:`<p>对三个轴分别算光线进入和离开两个平面的参数，取所有「进入」的最大值和所有「离开」的最小值，进入 ≤ 离开就相交。方向分量为 0 时直接判断原点是否在两平面之间。</p>`,

 formula:"O + tD = (1-u-v)V₀ + uV₁ + vV₂  →  [-D, E₁, E₂]·[t,u,v]ᵀ = O - V₀",
 why:`<p>把三角形上的点用重心坐标表示，和光线方程联立得到一个 3×3 线性方程组，用克莱姆法则求解；混合积可以用叉积和点积表示，共享中间量 p、q，非常省计算。用 |det| 而不是 det 判断，所以背面也能命中（双面）。</p>`,
 qa:[["推导一下 Möller–Trumbore？","联立 O + tD = V₀ + u·E₁ + v·E₂，整理成 -tD + uE₁ + vE₂ = S（S = O − V₀）。克莱姆法则：det = (D × E₂)·E₁，u = (D × E₂)·S / det，v = (S × E₁)·D / det，t = (S × E₁)·E₂ / det。先判断 u 再算 v、t，可以尽早退出。"],
 ["为什么要做双面求交？","Cornell 场景的墙壁、玻璃这类薄片或折射体，光线可能从背面打进来；折射时光线也要能从物体内部击中表面。front_face 告诉着色代码当前是从外面还是里面打中的，用来决定折射率比。"]]}});

node({id:"w_dl",g:"whitted",x:900,y:20,w:250,k:"func",t:"directLighting",s:"点光源 + 面光源 · BRDF = ρ/π",ins:["▶:exec","hit:HitRecord:struct"],outs:["L_direct:Vec3"],
 info:{loc:"RayRenderer.cpp#L592",sig:"Vector3f RayRenderer::directLighting(const HitRecord&, const Scene&, const RaySceneGeometry&, const std::vector<AreaLight>&, Rng* rng, RayCounters&) const",
 what:`<p>点光源：平方反比衰减 × 余弦 × 可见性。面光源：在发光三角形上取点（Whitted 用 4 个固定分层样本，路径追踪用 1 个随机样本），乘上两端的余弦和面积除以距离平方。</p>`,
 code:`// 面光源，一个样本的估计
L += brdf * emission * (cosθ_surface * cosθ_light * area / d²) * visibility;
// 4 个固定样本：(0.125,0.375) (0.375,0.875) (0.625,0.125) (0.875,0.625)`,
 formula:"L ≈ (ρ/π) · L_e · cosθ · cosθ' · A / d² · V，对应 pdf = 1/A 的面积采样",
 why:`<p>漫反射 BRDF 是 ρ/π，π 来自半球上余弦的积分。面光源从「对立体角积分」换成「对光源面积积分」时，雅可比是 cosθ'/d²，均匀面积采样 pdf 为 1/A，所以估计式里出现 A·cosθ'/d²。</p>`,
 qa:[["为什么 Whitted 用 4 个固定样本？","固定样本让同一个像素每次渲染结果完全一样，没有噪点，适合做确定性回归测试，但软阴影边缘会出现可见的分层条带。路径追踪里换成随机样本，靠多 spp 平均收敛。"],
 ["在三角形上均匀取点，为什么要开根号？","sampleTriangle 里 b0 = 1 − √u1。如果直接用两个均匀随机数当重心坐标，点会集中在某个顶点附近。开根号是对三角形面积分布做逆变换采样的结果，保证点在面积上均匀。"]]}});
node({id:"w_sh",g:"whitted",x:900,y:260,w:250,k:"pure",t:"occludedToPoint",s:"offsetOrigin + 末端容差",ins:["hit:HitRecord:struct","target:Vec3"],outs:["blocked:bool"],

 what:`<p>阴影线起点沿几何法线偏移一个 epsilon（朝光线出射的一侧），并对每个坐标再用 <code>nextafter</code> 往外推一个 ULP；终点留出与目标坐标量级相关的容差，避免打到光源自身。</p>`,

result[axis] = std::nextafter(result[axis], outward ? +inf : -inf);`,
 why:`<p>浮点误差会让交点落在表面略下方，从那里发出的光线会立刻打中自己（shadow acne，表现为满屏黑点）。偏移量和坐标大小相关：远离原点时浮点精度更低，需要更大的偏移。</p>`,
 qa:[["shadow acne 的成因和常见解法？","交点的浮点误差使它可能位于表面内侧，从那里出发的次级光线与同一表面相交。解法：1）起点沿法线偏移；2）设 t_min 下限；3）求交时排除自身图元；4）更严谨的做法是根据交点计算的误差界确定偏移量（PBRT 的方法）。这里用的是 1、2 加上 ULP 推移。"]]}});

 info:{loc:"RayRenderer.cpp#L914",sig:"return direct * roughness + albedo.cwise(reflection) * (1.0f - roughness);",
 what:`<p>沿着色法线计算完美反射方向，若反射到表面以下就改用几何法线再反射一次，仍然不行就只返回直接光照。结果是直接光照和反射颜色按 roughness 线性混合。</p>`,code:"",
 why:`<p>Whitted 只能追一条确定的反射线，没法表达粗糙反射的模糊，所以用 roughness 做了一个经验性的混合。这不是物理正确的 BRDF。</p>`,
 qa:[["为什么要检查反射方向是否在几何法线下方？","插值得到的着色法线和真实的几何法线不一致时，按着色法线算出的反射方向可能指向表面内部，会造成漏光或黑斑。用几何法线兜底是常见处理。"]]}});
node({id:"w_diel",g:"whitted",x:1220,y:330,w:250,k:"func",t:"电介质：反射 + 折射",s:"Schlick Fresnel 加权",ins:["▶:exec","hit:HitRecord:struct"],outs:["▶:exec","dirs×2:Vec3"],
 info:{loc:"RayRenderer.cpp#L931",sig:"return albedo * (reflected_color * F + refracted_color * (1 - F));",
 what:`<p>根据 front_face 决定折射率比 η = 1/ior（从外进入）或 ior（从内射出）。同时递归追踪反射线和折射线，按 Schlick 近似的 Fresnel 反射率加权。发生全反射时只追反射线。</p>`,
 code:`F = r0 + (1 - r0) * (1 - cosθ)^5,   r0 = ((1 - n) / (1 + n))²`,
 formula:"折射：t⊥ = η(d + n cosθ)，t∥ = −n·√(1 − |t⊥|²)；|t⊥|² > 1 时全反射",
 why:`<p>Whitted 在玻璃处分叉成两条光线，递归深度为 d 时最坏情况是 2^d 条光线，所以 max_depth 很重要。路径追踪则只随机选一条，用概率代替分叉。</p>`,
 qa:[["推导一下折射方向公式？","斯涅尔定律 η₁sinθ₁ = η₂sinθ₂。把入射方向分解成平行和垂直于法线的分量，垂直于法线的切向分量按 η = η₁/η₂ 缩放：t⊥ = η(d + n·cosθ₁)；折射方向是单位向量，所以法向分量长度为 √(1 − |t⊥|²)，方向指向表面另一侧。根号内为负就是全反射。"],
 ["Schlick 近似的意义？","完整的 Fresnel 方程要分别算 s、p 偏振，计算量大。Schlick 用 r0 + (1 − r0)(1 − cosθ)⁵ 近似，正入射时等于 r0（玻璃约 4%），掠射时趋近 1，很好地复现了「斜着看玻璃更像镜子」的效果。"]]}});
node({id:"w_rec",g:"whitted",x:1540,y:230,w:230,k:"macro",t:"traceWhitted(depth+1)",s:"max_depth 截断",ins:["▶:exec","dir:Vec3"],outs:["L:Vec3"],
 info:{loc:"RayRenderer.cpp#L925",sig:"traceWhitted(Ray(offsetOrigin(hit, reflected), reflected), ..., depth + 1, counters)",
 what:`<p>递归调用自身。达到 max_depth 时，金属只返回按 roughness 缩放的直接光照，玻璃返回黑色。</p>`,code:"",
 why:`<p>递归深度上限为 16（命令行参数校验）。截断会让多次反射的玻璃内部偏暗，这是有偏的，但 Whitted 本身就不追求无偏。</p>`,qa:[]}});

node({id:"pa_l",g:"path",x:40,y:170,w:240,k:"event",t:"tracePathVacuum",s:"for depth ≤ max_depth",outs:["▶:exec","ray:struct","throughput:Vec3"],
 info:{loc:"RayRenderer.cpp#L966",sig:"Vector3f RayRenderer::tracePathVacuum(const Ray&, ..., Rng& rng, RayCounters&) const",
 what:`<p>迭代而不是递归：维护当前光线、路径吞吐量 throughput（初始为 1）和累计辐射度 radiance。每次反弹更新 throughput，在每个漫反射顶点加上 throughput × 直接光照。</p>`,code:"",
 why:`<p>迭代写法没有递归栈，深度可以很大（最多 64）；也方便做俄罗斯轮盘赌，只要 break 出循环。</p>`,qa:[]}});
node({id:"pa_hit",g:"path",x:340,y:170,w:200,k:"func",t:"intersect",s:"不中则结束",ins:["▶:exec","ray:struct"],outs:["▶:exec","hit:HitRecord:struct"],
 info:{loc:"RayRenderer.cpp#L978",sig:"if (!geometry.intersect(...) || !hit.material) break;",what:`<p>没有环境光，打空直接结束。</p>`,code:"",why:"",qa:[]}});
node({id:"pa_em",g:"path",x:600,y:20,w:250,k:"branch",t:"命中发光体?",s:"只在 depth 0 或镜面后计入",ins:["▶:exec","hit:HitRecord:struct"],outs:["计入并结束:exec","否:exec"],
 info:{loc:"RayRenderer.cpp#L988",sig:"if (hit.front_face && (depth == 0 || previous_was_specular)) radiance += throughput * emission;",
 what:`<p>路径打到光源时，只有两种情况才把发光值加进来：相机直接看到光源（depth 0），或者上一次是镜面反射/折射。</p>`,code:"",
 why:`<p>漫反射顶点已经通过 NEE 显式采样过光源了，如果余弦采样的路径恰好又打中光源也计入，同一份光就被算了两次。镜面顶点无法做 NEE（delta 分布），所以只能靠路径碰巧打中光源来贡献。</p>`,
 qa:[["这种做法和 MIS 有什么区别？","这里是「二选一」：漫反射顶点只用光源采样，镜面顶点只用 BSDF 采样。多重重要性采样（MIS）则在每个顶点同时用两种策略，按各自 pdf 加权组合（比如功率启发式）。对小而亮的光源，光源采样好；对大面积光源配合高光泽表面，BSDF 采样好；MIS 能在两种情况下都稳健。这是这个实现可以改进的点。"]]}});
node({id:"pa_nee",g:"path",x:600,y:230,w:250,k:"func",t:"directLighting (NEE)",s:"每个面光源 1 个随机样本",ins:["▶:exec","hit:HitRecord:struct"],outs:["▶:exec","L_direct:Vec3"],
 info:{loc:"RayRenderer.cpp#L1001",sig:"radiance += throughput.cwise(directLighting(hit, ..., &rng, counters));",
 what:`<p>只在漫反射顶点做下一事件估计：向光源连一条阴影线，直接累加光源贡献。和 Whitted 是同一个函数，只是传入了 RNG，面光源改为随机取样。</p>`,code:"",
 why:`<p>如果只靠随机反弹碰巧打中光源，小光源（Cornell 盒顶上那块灯）会产生极大的噪声。NEE 让每个漫反射顶点都确定地得到一份直接光照贡献，方差大幅降低。</p>`,qa:[]}});
node({id:"pa_cos",g:"path",x:910,y:230,w:250,k:"pure",t:"sampleCosineHemisphere",s:"pdf = cosθ/π → throughput ×= ρ",ins:["n:Vec3","rng:struct"],outs:["dir:Vec3"],
 info:{loc:"RayRenderer.cpp#L471",sig:"Vector3f RayRenderer::sampleCosineHemisphere(const Vector3f& normal, Rng& rng) const",
 what:`<p>Malley 方法：在单位圆盘上均匀取点（半径取 √u），再投影到半球上，然后用法线建一个切线空间把方向转到世界空间。</p>`,
 code:`r = sqrt(u1);  φ = 2π·u2;
local = (r cosφ, r sinφ, sqrt(1 - r²));`,
 formula:"f·cosθ / pdf = (ρ/π)·cosθ / (cosθ/π) = ρ",
 why:`<p>漫反射的被积函数里有 cosθ，按 cosθ 成比例采样就是重要性采样：BRDF、余弦和 pdf 互相抵消，吞吐量只需乘 albedo。注意这里用的是几何法线采样，没用着色法线。</p>`,
 qa:[["为什么在圆盘上均匀取点再投影，就能得到余弦分布？","圆盘上面积元投影到半球，半球上的立体角元 dω 投影到圆盘的面积是 cosθ·dω。所以圆盘上均匀分布，对应半球上和 cosθ 成正比的分布。半径取 √u 是为了让点在圆盘面积上均匀。"]]}});
node({id:"pa_mt",g:"path",x:910,y:20,w:250,k:"pure",t:"金属 / 电介质",s:"扰动反射 · Fresnel 随机选",ins:["hit:HitRecord:struct","rng:struct"],outs:["dir:Vec3"],
 info:{loc:"RayRenderer.cpp#L1012",sig:"scattered = (perfect + sampleUnitSphere(rng) * roughness).normalize();  // 金属",
 what:`<p>金属：完美反射方向加上 roughness × 单位球内随机向量，再归一化（《Ray Tracing in One Weekend》的做法）。电介质：以 Fresnel 反射率为概率随机选反射或折射，吞吐量只乘 albedo。两者都标记为镜面顶点。</p>`,code:"",
 why:`<p>按 Fresnel 概率随机选择，相当于用概率代替 Whitted 里的加权分叉：选中反射的概率正好是反射权重，估计仍然无偏，但每条路径只有一个分支。</p>`,
 qa:[["这个金属模型的问题在哪？","扰动反射不对应任何真实的 BRDF，能量也不守恒；粗糙金属被当作镜面顶点处理（不做 NEE），roughness 大时噪声会很严重。标准做法是 GGX 微表面模型，配合可见法线采样（VNDF）和 NEE + MIS。"]]}});
node({id:"pa_rr",g:"path",x:1230,y:120,w:250,k:"branch",t:"俄罗斯轮盘赌",s:"depth ≥ 3 · p ∈ [0.05, 0.95]",ins:["▶:exec","throughput:Vec3"],outs:["存活:exec"],
 info:{loc:"RayRenderer.cpp#L1047",sig:"survival = clamp(maxComponent(throughput), 0.05, 0.95); if (rng >= survival) break; throughput /= survival;",
 what:`<p>前 3 次反弹不做；之后以 throughput 最大分量为存活概率（夹在 0.05 到 0.95 之间），没存活就终止路径，存活就把 throughput 除以存活概率。</p>`,code:"",
 formula:"E[L'] = p · (L / p) + (1 − p) · 0 = L",
 why:`<p>throughput 很小的路径对结果贡献很小，却和其他路径一样耗时。轮盘赌让它们大概率提前终止，但存活者按 1/p 放大，期望保持不变，所以是无偏的。代价是方差略增。</p>`,
 qa:[["为什么俄罗斯轮盘赌是无偏的？","存活时贡献是 L/p，概率 p；终止时贡献是 0，概率 1−p。期望 = p·L/p = L，和不做轮盘赌一样。它是用更多的方差换更少的计算量。"],
 ["为什么存活概率要设上下限？","下限 0.05 防止概率太小、存活者被放大 20 倍以上产生萤火虫（fireflies）；上限 0.95 保证即使 throughput 很大（比如多次镜面反射），路径也终究会终止。"]]}});
node({id:"pa_nx",g:"path",x:1540,y:150,w:230,k:"func",t:"下一段光线",s:"offsetOrigin · 记录是否镜面",ins:["▶:exec","dir:Vec3"],outs:["回到循环:exec"],
 info:{loc:"RayRenderer.cpp#L1055",sig:"ray = Ray(offsetOrigin(hit, scattered), scattered); previous_was_specular = specular;",
 what:`<p>从偏移后的交点沿新方向继续。<code>previous_was_specular</code> 供下一次击中光源时判断是否计入。</p>`,code:"",why:"",qa:[]}});

node({id:"s_prim",g:"sdfeval",x:40,y:60,w:250,k:"pure",t:"基本体距离函数",s:"球 · 盒 · 环 · 平面",ins:["p:Vec3"],outs:["d:float"],
 info:{loc:"SDF.cpp#L529",sig:"case NodeType::Sphere / Box / Torus / Plane",
 what:`<p>四种解析基本体的精确有符号距离：外部为正，内部为负，表面为 0。环面支持任意朝向的轴。</p>`,
 code:`// 盒子
q = |p - center| - half_extents;
d = length(max(q, 0)) + min(max(q.x, q.y, q.z), 0);
// 环面
axial = dot(p - c, axis);  radial = |(p - c) - axial*axis|;
d = sqrt((radial - R)² + axial²) - r;`,
 why:`<p>盒子公式分两部分：点在外部时，到最近角/边/面的距离是 max(q,0) 的长度；在内部时，到最近面的距离是 q 的最大分量（负数）。两部分互斥，相加就同时覆盖了内外。</p>`,
 qa:[["推导一下盒子的 SDF？","利用对称性只看第一卦限，q = |p| − b 是点到三个面的有符号距离。若 q 全负，点在内部，离最近的面距离是 max(q)。若有正分量，点在外部，最近点是把正分量投影掉之后的位置，距离是 |max(q,0)|。两者合并就是公式。"]]}});
node({id:"s_csg",g:"sdfeval",x:360,y:20,w:240,k:"pure",t:"CSG：并 / 交 / 差",s:"min · max · max(a, −b)",ins:["a:float","b:float"],outs:["d:float"],
 info:{loc:"SDF.cpp#L585",sig:"Union: min(a,b);  Intersection: max(a,b);  Difference: max(a,-b)",
 what:`<p>两个子树分别求值后组合。</p>`,code:"",
 why:`<p>并集的 min 在外部是精确距离；交集和差集的 max 在很多区域只是距离的<b>下界</b>，不是精确距离。但它们的 Lipschitz 常数仍然不超过 1，所以对 sphere tracing 是安全的，只是步子会偏小。</p>`,
 qa:[["CSG 之后还是精确的 SDF 吗？会有什么影响？","不一定。比如两个球的交集，在凹进去的区域 max(a,b) 小于真实距离。只要结果是距离的下界（Lipschitz ≤ 1），sphere tracing 就不会穿过表面，只是会多走几步；但如果用它来做软阴影、AO 这类依赖距离值本身的效果，就会有偏差。"]]}});
node({id:"s_sm",g:"sdfeval",x:360,y:230,w:240,k:"pure",t:"平滑并",s:"多项式 smin · 参数 k",ins:["a:float","b:float","k:float"],outs:["d:float"],
 info:{loc:"SDF.cpp#L596",sig:"blend = clamp(0.5 + 0.5 (b - a) / k, 0, 1); d = mix(b, a, blend) - k·blend·(1 - blend);",
 what:`<p>在两个形状距离接近（差小于 k）的区域把 min 换成一条平滑曲线，形成融合的圆角过渡。</p>`,code:"",
 formula:"h = clamp(½ + ½(b−a)/k, 0, 1)，smin = lerp(b, a, h) − k·h(1−h)",
 why:`<p>h(1−h) 在 h = ½ 时最大为 ¼，所以平滑并最多比 min(a,b) 小 k/4。包围盒计算正是利用这个界把子节点的包围盒外扩 k/4。</p>`,
 qa:[["为什么平滑并的包围盒要外扩？","smin 会比两个输入都小，所以即使某个点在两个子形状各自的零等值面之外，smin 也可能小于 0，在中间「长出」新的表面。只用子形状的零等值面包围盒会把这部分漏掉，所以要对「距离 ≤ k/4」的子水平集求包围盒。"]]}});
node({id:"s_tree",g:"sdfeval",x:680,y:120,w:250,k:"func",t:"makeBinary",s:"不可变树 · 深度 ≤ 64",ins:["left:struct","right:struct"],outs:["shape:struct"],
 info:{loc:"SDF.cpp#L725",sig:"SDFShape SDFShape::makeBinary(NodeType type, const SDFShape& left, const SDFShape& right, float smoothing)",
 what:`<p>用 <code>shared_ptr&lt;const Node&gt;</code> 组成不可变的表达式树，子树可以被多棵树共享。构建时就算好基本体数、运算数、深度、Lipschitz 上界（取左右最大值）和保守包围盒，并检查深度和展开节点数上限。</p>`,code:"",
 why:`<p>不可变 + 构建时预计算，让求值时的树是只读的，多线程可以直接共享，不需要锁。Lipschitz 取 max 的理由：min、max、smin 都不会让梯度变陡。</p>`,qa:[]}});
node({id:"s_bnd",g:"sdfeval",x:1000,y:40,w:240,k:"pure",t:"sublevelBounds",s:"保守包围盒",ins:["shape:struct"],outs:["bounds:struct"],
 info:{loc:"SDF.cpp#L497",sig:"SDFBounds sublevelBounds(double level) const",
 what:`<p>递归计算「距离 ≤ level 的点集」的包围盒：并集取并，交集取交，差集只取左边，平滑并先把 level 增加 k/4 再取并，平面无界。</p>`,code:"",
 why:`<p>sphere tracing 前先用这个盒子裁剪光线区间，盒子外的部分直接跳过，不用逐步求值。</p>`,qa:[]}});
node({id:"s_grid",g:"sdfeval",x:40,y:330,w:250,k:"pure",t:"SampledSDFGrid",s:"稠密网格 · 三线性",ins:["samples:float[]:float"],outs:["d:float","L:float"],
 info:{loc:"SDF.cpp#L140",sig:"float SampledSDFGrid::distance(const Vector3f& point) const",
 what:`<p>规则网格上存距离值，查询时三线性插值（7 次 lerp）。构建时扫描所有相邻节点的差分，求出插值场的 Lipschitz 上界，并要求边界节点非负（形状必须在网格内部）。</p>`,code:"",
 why:`<p>三线性插值后的场不再是精确距离，梯度可能大于 1；如果仍按 L = 1 步进，就可能穿过表面。所以 Lipschitz 要从数据里实际算出来，步长按 |d|/L 缩小。</p>`,
 qa:[["为什么要算采样网格的 Lipschitz 常数？","sphere tracing 的安全性依赖「|∇d| ≤ L」：从距离为 d 的点前进 d/L，保证不会越过表面。采样、截断、插值都可能让梯度大于 1，假设 L = 1 会漏掉薄的部分。三线性插值是分段多线性的，最大梯度由相邻节点差分决定，所以可以精确给出上界。"]]}});
node({id:"s_sp",g:"sdfeval",x:360,y:420,w:250,k:"pure",t:"SparseSampledSDFGrid",s:"8³ brick · 截断后压缩",ins:["dense:struct"],outs:["d:float"],
 info:{loc:"SDF.cpp#L301",sig:"SparseSampledSDFGrid::SparseSampledSDFGrid(const SampledSDFGrid& dense, float distance_limit)",
 what:`<p>先把稠密网格截断到 [−τ, τ]（TSDF），再切成 8×8×8 的 brick：全部等于 +τ 的是常量外部块，全部等于 −τ 的是常量内部块，都不存样本；其余的是活动块，存 9³ 个节点。</p>`,code:"",
 why:`<p>远离表面的地方距离值本来就被截断成常量，没有信息量。只有表面附近窄带内的 brick 需要存数据，内存按表面积而不是体积增长。查询结果和截断后的稠密网格逐位一致。</p>`,

 why:`<p>每个节点的计算完全独立，而且只写自己的位置，天然适合并行；按切片分任务，任务粒度适中。同样做到了 1 线程和 N 线程逐位一致。</p>`,qa:[]}});
node({id:"m_cp",g:"meshsdf",x:1580,y:80,w:240,k:"pure",t:"BVH::closestPoint",s:"分支定界 → |d|",ins:["p:Vec3"],outs:["|d|:float"],
 info:{loc:"RayGeometry.cpp#L1111",sig:"bool BVH::closestPoint(const Vector3f& point, ClosestPointRecord& closest, double maximum_squared_distance, BVHPointQueryStats*) const",
 what:`<p>遍历 BVH，用点到 AABB 的距离作为下界：下界已经大于当前最优就剪掉整棵子树。叶子里精确计算点到三角形的最近点（按 Voronoi 区域分顶点、边、面三种情况）。退化三角形在独立的距离 BVH 里也会被查询。</p>`,code:"",
 why:`<p>和光线遍历是同一个「分支定界」思路，只是剪枝条件从「进入距离 > 最近 t」换成「到盒子的距离 > 当前最近距离」。</p>`,qa:[]}});
node({id:"m_par",g:"meshsdf",x:1580,y:300,w:250,k:"pure",t:"collectSurfaceCrossings × 3",s:"奇偶投票定符号",ins:["p:Vec3"],outs:["inside:bool"],
 info:{loc:"RayGeometry.cpp#L1219",sig:"bool BVH::collectSurfaceCrossings(const Ray&, float t_min, float t_max, std::vector<float>& crossings, ...) const",
 what:`<p>从节点沿三个固定的「不规则」方向各发一条射线，收集所有和网格的交点，排序并合并距离很近的重复交点（共享边会被相邻两个三角形各算一次）。交点数为奇数说明在内部；三票里至少两票是内部才判为内部。</p>`,code:"",
 why:`<p>射线穿过闭合表面时内外交替，所以交点数的奇偶性表示内外。单条射线可能正好擦过边或顶点导致计数错误，选三个不对齐坐标轴的方向投票，能大大降低这种概率。</p>`,
 qa:[["除了射线奇偶性，还有什么定符号的方法？","1）角加权伪法线：看最近点处的法线和点到最近点向量的点积符号，只需一次最近点查询，但要求网格质量好；2）广义环绕数（generalized winding number）：对所有三角形求立体角之和，对有洞、自相交的网格也稳健，代价较高但可以用 BVH 加速；3）体素化后泛洪填充外部。"]]}});
node({id:"m_out",g:"meshsdf",x:1890,y:200,w:240,k:"func",t:"截断 + 稀疏 brick",s:"送入 SDF 模块",ins:["|d|:float","inside:bool"],outs:["grid:struct"],drill:"sdfeval",
 info:{loc:"MeshDistanceField.cpp#L300",sig:"SampledSDFGrid → truncated(τ) → SparseSampledSDFGrid",
 what:`<p>组合成有符号距离写入网格，再按截断带宽截断，压成稀疏 brick 网格，作为一个 SDF 叶子节点参与渲染。benchmark 会把它和中位数 BVH、SAH BVH 在同一组光线上比较精度、内存和速度。</p>`,code:"",why:"",qa:[]}});
E.push(["meshsdf","m_top","▶","m_fill","▶"],["meshsdf","m_top","topology","m_rep","topology"],["meshsdf","m_rep","report","m_fill","report"],["meshsdf","m_fill","closed","m_cl","closed"],["meshsdf","m_fill","▶","m_bvh","▶"],["meshsdf","m_fill","closed","m_bvh","closed"],
 ["meshsdf","m_bvh","▶","m_bake","▶"],["meshsdf","m_bvh","bvh","m_bake","bvh"],["meshsdf","m_cp","|d|","m_out","|d|"],["meshsdf","m_par","inside","m_out","inside"]);
COMMENTS.push({g:"meshsdf",x:1560,y:20,w:290,h:420,t:"每个网格节点"});

/* ---------- geometry ---------- */
const HEAD=40, ROW=22, PAD=12;
function parsePin(s){const p=s.split(":");const name=p[0];let t=p[p.length-1];const label=p.length===3?p[0]+" : "+p[1]:p[0]+(t==="exec"?"":" : "+t);
  if(t.endsWith("[]")) t=t.slice(0,-2);return {name,t:TYPES[t]?t:"struct",label:p.length===3?p[1]:(t==="exec"?"":t),arr:s.includes("[]")||s.includes("[3]")};}
N.forEach(n=>{n.ins=(n.ins||[]).map(parsePin);n.outs=(n.outs||[]).map(parsePin);const rows=Math.max(n.ins.length,n.outs.length);n.h=HEAD+rows*ROW+PAD+(n.drill?18:0);});
const byId=Object.fromEntries(N.map(n=>[n.id,n]));
function pinPos(n,side,name){const list=side==="in"?n.ins:n.outs;let i=list.findIndex(p=>p.name===name);if(i<0)i=0;return {x:side==="in"?n.x:n.x+n.w,y:n.y+HEAD+i*ROW+ROW/2,t:list[i]?list[i].t:"struct"};}

/* ---------- render ---------- */
const svg=document.getElementById("canvas"),view=document.getElementById("view"),stage=document.getElementById("stage");
const NS="http://www.w3.org/2000/svg";
const el=(t,a={},p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
let cur="frame",sel=null,tf={x:0,y:0,k:1},wireEls=[],fx=null;

function draw(){
  view.innerHTML="";
  const nodes=N.filter(n=>n.g===cur),edges=E.filter(e=>e[0]===cur);
  const connected=new Set();edges.forEach(e=>{connected.add(e[1]+">"+e[2]);connected.add(e[3]+"<"+e[4]);});
  COMMENTS.filter(c=>c.g===cur).forEach(c=>{const g=el("g",{class:"cmt"},view);el("rect",{x:c.x,y:c.y,width:c.w,height:c.h,rx:8},g);const t=el("text",{x:c.x+12,y:c.y+22},g);t.textContent=c.t;});
  const wires=el("g",{},view);wireEls=[];
  edges.forEach(e=>{const a=byId[e[1]],b=byId[e[3]];if(!a||!b)return;const p=pinPos(a,"out",e[2]),q=pinPos(b,"in",e[4]);
    const dx=Math.max(60,Math.abs(q.x-p.x)*.5);
    const path=el("path",{d:`M${p.x},${p.y} C${p.x+dx},${p.y} ${q.x-dx},${q.y} ${q.x},${q.y}`,class:"wire"+(p.t==="exec"?" exec":""),stroke:cssv(TYPES[p.t])},wires);
    if(p.t!=="exec")path.classList.add("data");
    path.dataset.a=e[1];path.dataset.b=e[3];wireEls.push({a:e[1],b:e[3],path,color:cssv(TYPES[p.t])});});
  fx=el("g",{},view);
  nodes.forEach(n=>{
    const g=el("g",{class:"node",transform:`translate(${n.x},${n.y})`,tabindex:0,role:"button","aria-label":n.t},view);g.dataset.id=n.id;
    el("rect",{class:"body",width:n.w,height:n.h,rx:7},g);
    const hc=cssv(KIND[n.k][1]);
    el("path",{d:`M0,7 a7,7 0 0 1 7,-7 h${n.w-14} a7,7 0 0 1 7,7 v${HEAD-12} h-${n.w} z`,fill:hc},g);
    const tt=el("text",{class:"ttl",x:12,y:18},g);tt.textContent=n.t;
    const st=el("text",{class:"sub",x:12,y:32},g);st.textContent=n.s||"";
    const drawPin=(p,i,side)=>{const y=HEAD+i*ROW+ROW/2,x=side==="in"?0:n.w;const c=cssv(TYPES[p.t]);const on=connected.has(n.id+(side==="in"?"<":">")+p.name);
      if(p.t==="exec"){const s=6;el("path",{d:`M${x-s},${y-s} h${s} l${s},${s} l-${s},${s} h-${s} z`,fill:on?c:"none",stroke:c,"stroke-width":1.5},g);}
      else if(p.arr){el("rect",{x:x-5,y:y-5,width:10,height:10,rx:1.5,fill:on?c:"none",stroke:c,"stroke-width":1.5},g);}
      else el("circle",{cx:x,cy:y,r:5,fill:on?c:"none",stroke:c,"stroke-width":1.5},g);
      const lbl=p.name==="▶"?"":p.name;const tx=el("text",{class:"pl",x:side==="in"?12:n.w-12,y:y+4,"text-anchor":side==="in"?"start":"end"},g);tx.textContent=lbl;};
    n.ins.forEach((p,i)=>drawPin(p,i,"in"));n.outs.forEach((p,i)=>drawPin(p,i,"out"));
    if(n.drill){const d=el("text",{class:"drill",x:12,y:n.h-10},g);d.textContent="⤵ 双击进入子图";}
    g.addEventListener("click",ev=>{ev.stopPropagation();select(n.id);});
    g.addEventListener("dblclick",ev=>{ev.stopPropagation();if(n.drill)go(n.drill);});
    g.addEventListener("keydown",ev=>{if(ev.key==="Enter"){select(n.id);} if(ev.key===" "&&n.drill){ev.preventDefault();go(n.drill);}});
  });
  applySel();
}
function applySel(){
  svg.classList.toggle("focus",!!sel);
  const near=new Set();
  view.querySelectorAll(".wire").forEach(w=>{const hot=sel&&(w.dataset.a===sel||w.dataset.b===sel);w.classList.toggle("hot",!!hot);if(hot){near.add(w.dataset.a);near.add(w.dataset.b);}});
  view.querySelectorAll(".node").forEach(g=>{g.classList.toggle("sel",g.dataset.id===sel);g.classList.toggle("near",near.has(g.dataset.id));});
}
function setT(){view.setAttribute("transform",`translate(${tf.x},${tf.y}) scale(${tf.k})`);
  const s1=20*tf.k,s2=100*tf.k;stage.style.backgroundSize=`${s2}px ${s2}px,${s2}px ${s2}px,${s1}px ${s1}px,${s1}px ${s1}px`;stage.style.backgroundPosition=`${tf.x}px ${tf.y}px`;}
function fit(){const ns=N.filter(n=>n.g===cur);const cs=COMMENTS.filter(c=>c.g===cur);
  let x0=Math.min(...ns.map(n=>n.x),...cs.map(c=>c.x)),y0=Math.min(...ns.map(n=>n.y),...cs.map(c=>c.y)),x1=Math.max(...ns.map(n=>n.x+n.w),...cs.map(c=>c.x+c.w)),y1=Math.max(...ns.map(n=>n.y+n.h),...cs.map(c=>c.y+c.h));
  const r=stage.getBoundingClientRect();const m=40;const k=Math.min(1,(r.width-2*m)/(x1-x0),(r.height-2*m-30)/(y1-y0));
  tf.k=Math.max(r.width<700?.45:.62,k);const gw=(x1-x0)*tf.k;tf.x=gw<r.width-2*m?(r.width-gw)/2-x0*tf.k:m-x0*tf.k;tf.y=(r.height-(y1-y0)*tf.k)/2-y0*tf.k+12;setT();}
function zoom(f,cx,cy){const r=stage.getBoundingClientRect();if(cx===undefined){cx=r.width/2;cy=r.height/2;}const k=Math.min(2.2,Math.max(.2,tf.k*f));tf.x=cx-(cx-tf.x)*k/tf.k;tf.y=cy-(cy-tf.y)*k/tf.k;tf.k=k;setT();}

/* ---------- panel ---------- */
const panel=document.getElementById("panel");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function graphIntro(){const g=GRAPHS.find(x=>x.id===cur);const list=N.filter(n=>n.g===cur).map(n=>`<li><code>${esc(n.t)}</code> <span style="color:var(--muted)">${esc(n.s||"")}</span></li>`).join("");
  panel.innerHTML=`<span class="kind" style="background:${cssv("--h-macro")}">${g.lvl} · 图</span><h2>${g.name}</h2>${g.intro}<h3>本图节点</h3><ul style="padding-left:18px;line-height:1.9;margin:0">${list}</ul><p class="empty" style="margin-top:16px">单击画布上的节点查看函数拆解。</p>`;}
function select(id){sel=id;applySel();const n=byId[id],i=n.info||{};const k=KIND[n.k];
  let h=`<span class="kind" style="background:${cssv(k[1])}">${k[0]}</span><h2>${esc(n.t)}</h2>`;
  if(i.loc)h+=`<a class="loc" href="${GH+i.loc}" target="_blank" rel="noopener">${i.loc.replace("#L",":")} ↗</a>`;
  if(i.sig)h+=`<h3>签名</h3><pre class="sig">${esc(i.sig)}</pre>`;
  if(i.what)h+=`<h3>做了什么</h3>${i.what}`;
  if(i.code)h+=`<h3>关键代码</h3><pre>${esc(i.code)}</pre>`;
  if(i.formula)h+=`<div class="formula">${esc(i.formula)}</div>`;
  if(i.why)h+=`<h3>原理与设计</h3>${i.why}`;
  if(i.qa&&i.qa.length)h+=`<h3>面试可能怎么问</h3>`+i.qa.map(q=>`<details><summary>${esc(q[0])}</summary><div class="ans">${esc(q[1])}</div></details>`).join("");
  if(n.drill){const g=GRAPHS.find(x=>x.id===n.drill);h+=`<button class="drillbtn" id="dbtn">进入子图：${g.name} →</button>`;}
  panel.innerHTML=h;panel.scrollTop=0;const b=document.getElementById("dbtn");if(b)b.onclick=()=>go(n.drill);}

/* ---------- nav ---------- */
const tabs=document.getElementById("tabs"),crumb=document.getElementById("crumb");
const modsEl=document.getElementById("mods");let curMod=null;
MODS.forEach(([id,name])=>{const b=document.createElement("button");b.className="mod";b.textContent=name;b.dataset.id=id;b.onclick=()=>{const g=GRAPHS.find(x=>x.mod===id);if(g)go(g.id);};modsEl.appendChild(b);});
function buildTabs(mod){tabs.innerHTML="";GRAPHS.filter(g=>g.mod===mod).forEach(g=>{const b=document.createElement("button");b.className="tab";b.role="tab";b.innerHTML=`<span class="lvl">${g.lvl}</span>${g.name}`;b.onclick=()=>go(g.id);b.dataset.id=g.id;tabs.appendChild(b);});tabs.hidden=GRAPHS.filter(g=>g.mod===mod).length<2;}
function go(id){stopSim();const gg=GRAPHS.find(x=>x.id===id);if(gg.mod!==curMod){curMod=gg.mod;buildTabs(curMod);modsEl.querySelectorAll(".mod").forEach(b=>b.setAttribute("aria-pressed",b.dataset.id===curMod));}cur=id;sel=null;draw();fit();graphIntro();
  tabs.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.id===id));
  const chain=[];let g=GRAPHS.find(x=>x.id===id);while(g){chain.unshift(g.name);g=GRAPHS.find(x=>x.id===g.parent);}
  crumb.innerHTML=chain.map((c,i)=>i===chain.length-1?`<b>${c}</b>`:c).join(" › ");
  try{localStorage.setItem("trb-graph2",id);}catch(e){}}
const lg=document.getElementById("legend");TYPE_NAMES.forEach(([t,n])=>{lg.insertAdjacentHTML("beforeend",`<span><i style="background:${cssv(TYPES[t])}"></i>${n}</span>`);});

/* ---------- data-flow simulation ---------- */
const playBtn=document.getElementById("play");
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
let simToken=0;
function stopSim(){simToken++;playBtn.classList.remove("on");playBtn.textContent="▶ 数据流演示";
  if(fx)fx.innerHTML="";view.querySelectorAll(".node").forEach(g=>g.classList.remove("fire","done"));}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function travel(w,token){return new Promise(res=>{
  const len=w.path.getTotalLength();const c=el("circle",{r:5.5,fill:w.color,filter:"url(#glow)",class:"particle"},fx);
  const dur=reduce?1:Math.min(1300,Math.max(650,len*1.6));const t0=performance.now();
  const tick=now=>{if(token!==simToken){c.remove();return res();}
    const t=Math.min(1,(now-t0)/dur);const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;const pt=w.path.getPointAtLength(e*len);
    c.setAttribute("cx",pt.x);c.setAttribute("cy",pt.y);if(t<1)requestAnimationFrame(tick);else{c.remove();res();}};
  requestAnimationFrame(tick);});}
async function playSim(){
  stopSim();const token=simToken;playBtn.classList.add("on");playBtn.textContent="■ 停止";
  const ids=N.filter(n=>n.g===cur).map(n=>n.id);const indeg=Object.fromEntries(ids.map(i=>[i,0]));
  wireEls.forEach(w=>indeg[w.b]++);
  let wave=ids.filter(i=>indeg[i]===0);const nodeEl=id=>view.querySelector(`.node[data-id="${id}"]`);
  while(wave.length&&token===simToken){
    wave.forEach(id=>{const g=nodeEl(id);g.classList.add("fire");});
    if(wave.length===1)select(wave[0]);
    await wait(reduce?0:420);if(token!==simToken)return;
    const outs=wireEls.filter(w=>wave.includes(w.a));
    wave.forEach(id=>{const g=nodeEl(id);g.classList.remove("fire");g.classList.add("done");});
    const next=[];await Promise.all(outs.map(w=>travel(w,token).then(()=>{if(--indeg[w.b]===0)next.push(w.b);})));
    wave=next;}
  if(token!==simToken)return;await wait(1400);if(token===simToken)stopSim();}
playBtn.onclick=()=>{playBtn.classList.contains("on")?stopSim():playSim();};

/* ---------- pan / zoom ---------- */
let drag=null;
stage.addEventListener("pointerdown",e=>{if(e.target.closest(".node,.btn"))return;drag={x:e.clientX,y:e.clientY,tx:tf.x,ty:tf.y,moved:false};stage.setPointerCapture(e.pointerId);stage.classList.add("dragging");});
stage.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>3)drag.moved=true;tf.x=drag.tx+dx;tf.y=drag.ty+dy;setT();});
stage.addEventListener("pointerup",e=>{if(drag&&!drag.moved&&!e.target.closest(".node")){sel=null;applySel();graphIntro();}drag=null;stage.classList.remove("dragging");});
stage.addEventListener("wheel",e=>{e.preventDefault();const r=stage.getBoundingClientRect();zoom(e.deltaY<0?1.12:1/1.12,e.clientX-r.left,e.clientY-r.top);},{passive:false});
document.getElementById("zin").onclick=()=>zoom(1.2);document.getElementById("zout").onclick=()=>zoom(1/1.2);document.getElementById("fit").onclick=fit;
window.addEventListener("resize",fit);
let start="repo";try{const s=localStorage.getItem("trb-graph2");if(s&&GRAPHS.some(g=>g.id===s))start=s;}catch(e){}
go(start);
</script>
